<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせフォーム</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="contact">
      <h1 class="contact__title">お問い合わせ</h1>
      <p class="contact__description">お問い合わせ内容をご入力ください。</p>

      <form class="contact__form" id="contact-form" action="#" method="post">
        <div class="contact__field">
          <label class="contact__label" for="name">
            お名前 <span class="contact__required">必須</span>
          </label>
          <input
            class="contact__input"
            type="text"
            id="name"
            name="name"
            placeholder="山田 太郎"
            required
          />
          <p class="contact__error" id="name-error"></p>
        </div>

        <div class="contact__field">
          <label class="contact__label" for="kana">
            ふりがな <span class="contact__required">必須</span>
          </label>
          <input
            class="contact__input"
            type="text"
            id="kana"
            name="kana"
            placeholder="やまだ たろう"
            required
          />
          <p class="contact__error" id="kana-error"></p>
        </div>

        <div class="contact__field">
          <label class="contact__label" for="phone">
            電話番号 <span class="contact__required">必須</span>
          </label>
          <input
            class="contact__input"
            type="tel"
            id="phone"
            name="phone"
            placeholder="09012345678"
            required
          />
          <p class="contact__error" id="phone-error"></p>
        </div>

        <div class="contact__field">
          <label class="contact__label" for="mail">
            メールアドレス <span class="contact__required">必須</span>
          </label>
          <input class="contact__input" type="email" id="mail" name="mail" required/>
          <p class="contact__error" id="mail-error"></p>
        </div>

        <div class="contact__field">
          <label class="contact__label" for="address">
            住所 <span class="contact__required">必須</span>
          </label>
          <input
            class="contact__input"
            type="text"
            id="address"
            name="address"
            placeholder="東京都〇〇区..."
            required
          />
          <p class="contact__error" id="address-error"></p>
        </div>

        <div class="contact__field">
          <label class="contact__label" for="category">
            お問い合わせ種別
          </label>
          <select class="contact__input" id="category" name="category">
            <option value="">選択してください</option>
            <option value="service">サービスについて</option>
            <option value="estimate">お見積もりについて</option>
            <option value="other">その他</option>
          </select>
        </div>

        <div class="contact__field">
          <label class="contact__label" for="message">
            お問い合わせ <span class="contact__required">必須</span>
          </label>
          <textarea
            class="contact__input contact__textarea"
            id="message"
            name="message"
            rows="6"
            placeholder="お問い合わせ内容をご入力ください"
            required
          ></textarea>
          <p class="contact__error" id="message-error"></p>
        </div>

        <button class="contact__button" type="submit">送信する</button>
      </form>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="js/contact.js"></script>
  </body>
</html>
